<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlack" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222222"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#14497F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="470" fill="#ffffff"/>

  <!-- Panel titles -->
  <text x="280" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#14497F">Model hierarkis (higher-order)</text>
  <text x="820" y="24" text-anchor="middle" font-size="17" font-weight="700" fill="#14497F">Model bifaktor</text>

  <!-- divider -->
  <line x1="550" y1="40" x2="550" y2="400" stroke="#cccccc" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- ================= PANEL A: HIGHER-ORDER ================= -->
  <!-- lines first -->
  <g stroke="#222222" stroke-width="1.6" fill="none">
    <line x1="280" y1="116" x2="140" y2="160" marker-end="url(#arrowBlack)"/>
    <line x1="280" y1="116" x2="280" y2="160" marker-end="url(#arrowBlack)"/>
    <line x1="280" y1="116" x2="420" y2="160" marker-end="url(#arrowBlack)"/>

    <line x1="140" y1="204" x2="110" y2="270" marker-end="url(#arrowBlack)"/>
    <line x1="140" y1="204" x2="170" y2="270" marker-end="url(#arrowBlack)"/>
    <line x1="280" y1="204" x2="250" y2="270" marker-end="url(#arrowBlack)"/>
    <line x1="280" y1="204" x2="310" y2="270" marker-end="url(#arrowBlack)"/>
    <line x1="420" y1="204" x2="390" y2="270" marker-end="url(#arrowBlack)"/>
    <line x1="420" y1="204" x2="450" y2="270" marker-end="url(#arrowBlack)"/>
  </g>

  <!-- g node -->
  <circle cx="280" cy="90" r="26" fill="#14497F" stroke="#0d2f52" stroke-width="1.5"/>
  <text x="280" y="97" text-anchor="middle" font-size="18" font-style="italic" font-weight="700" fill="#ffffff">g</text>

  <!-- broad ability boxes -->
  <g>
    <rect x="95" y="160" width="90" height="44" rx="4" fill="#e9e9e9" stroke="#333333" stroke-width="1.3"/>
    <text x="140" y="187" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#111">Gf</text>

    <rect x="235" y="160" width="90" height="44" rx="4" fill="#e9e9e9" stroke="#333333" stroke-width="1.3"/>
    <text x="280" y="187" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#111">Gc</text>

    <rect x="375" y="160" width="90" height="44" rx="4" fill="#e9e9e9" stroke="#333333" stroke-width="1.3"/>
    <text x="420" y="187" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#111">Gv</text>
  </g>

  <!-- narrow ability boxes -->
  <g font-size="10.3" fill="#222">
    <rect x="78" y="270" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="110" y="286" text-anchor="middle">Induksi</text>
    <text x="110" y="300" text-anchor="middle">(Gf)</text>

    <rect x="138" y="270" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="170" y="286" text-anchor="middle">Deduksi</text>
    <text x="170" y="300" text-anchor="middle">(Gf)</text>

    <rect x="218" y="270" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="250" y="286" text-anchor="middle">Kosakata</text>
    <text x="250" y="300" text-anchor="middle">(Gc)</text>

    <rect x="278" y="270" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="310" y="286" text-anchor="middle">Info Umum</text>
    <text x="310" y="300" text-anchor="middle">(Gc)</text>

    <rect x="358" y="270" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="390" y="286" text-anchor="middle">Visualisasi</text>
    <text x="390" y="300" text-anchor="middle">(Gv)</text>

    <rect x="418" y="270" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="450" y="286" text-anchor="middle">Rotasi</text>
    <text x="450" y="300" text-anchor="middle">(Gv)</text>
  </g>

  <!-- panel A note -->
  <text x="280" y="345" text-anchor="middle" font-size="12.5" font-style="italic" fill="#444444">
    <tspan x="280" dy="0">Pengaruh <tspan font-style="italic" font-weight="700">g</tspan> ke indikator sepenuhnya</tspan>
    <tspan x="280" dy="16">dimediasi oleh broad abilities (Gf, Gc, Gv, ...)</tspan>
  </text>

  <!-- ================= PANEL B: BIFACTOR ================= -->
  <!-- narrow abilities sit in the middle row so both g (top) and broad abilities (bottom) -->
  <!-- can point straight at them without routing around each other -->

  <!-- blue g -> narrow (straight fan, top row to middle row) -->
  <g stroke="#14497F" stroke-width="1.6" fill="none">
    <line x1="820" y1="116" x2="642" y2="160" marker-end="url(#arrowBlue)"/>
    <line x1="820" y1="116" x2="718" y2="160" marker-end="url(#arrowBlue)"/>
    <line x1="820" y1="116" x2="782" y2="160" marker-end="url(#arrowBlue)"/>
    <line x1="820" y1="116" x2="858" y2="160" marker-end="url(#arrowBlue)"/>
    <line x1="820" y1="116" x2="922" y2="160" marker-end="url(#arrowBlue)"/>
    <line x1="820" y1="116" x2="998" y2="160" marker-end="url(#arrowBlue)"/>
  </g>

  <!-- black broad -> narrow (bottom row up to middle row) -->
  <g stroke="#222222" stroke-width="1.6" fill="none">
    <line x1="680" y1="266" x2="642" y2="200" marker-end="url(#arrowBlack)"/>
    <line x1="680" y1="266" x2="718" y2="200" marker-end="url(#arrowBlack)"/>
    <line x1="820" y1="266" x2="782" y2="200" marker-end="url(#arrowBlack)"/>
    <line x1="820" y1="266" x2="858" y2="200" marker-end="url(#arrowBlack)"/>
    <line x1="960" y1="266" x2="922" y2="200" marker-end="url(#arrowBlack)"/>
    <line x1="960" y1="266" x2="998" y2="200" marker-end="url(#arrowBlack)"/>
  </g>

  <!-- g node (top) -->
  <circle cx="820" cy="90" r="26" fill="#14497F" stroke="#0d2f52" stroke-width="1.5"/>
  <text x="820" y="97" text-anchor="middle" font-size="18" font-style="italic" font-weight="700" fill="#ffffff">g</text>

  <!-- narrow ability boxes (middle row) -->
  <g font-size="10.3" fill="#222">
    <rect x="610" y="160" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="642" y="176" text-anchor="middle">Induksi</text>
    <text x="642" y="190" text-anchor="middle">(Gf)</text>

    <rect x="686" y="160" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="718" y="176" text-anchor="middle">Deduksi</text>
    <text x="718" y="190" text-anchor="middle">(Gf)</text>

    <rect x="750" y="160" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="782" y="176" text-anchor="middle">Kosakata</text>
    <text x="782" y="190" text-anchor="middle">(Gc)</text>

    <rect x="826" y="160" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="858" y="176" text-anchor="middle">Info Umum</text>
    <text x="858" y="190" text-anchor="middle">(Gc)</text>

    <rect x="890" y="160" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="922" y="176" text-anchor="middle">Visualisasi</text>
    <text x="922" y="190" text-anchor="middle">(Gv)</text>

    <rect x="966" y="160" width="64" height="40" rx="3" fill="#f6f6f6" stroke="#666666" stroke-width="1"/>
    <text x="998" y="176" text-anchor="middle">Rotasi</text>
    <text x="998" y="190" text-anchor="middle">(Gv)</text>
  </g>

  <!-- broad ability boxes (bottom row) -->
  <g>
    <rect x="635" y="266" width="90" height="44" rx="4" fill="#e9e9e9" stroke="#333333" stroke-width="1.3"/>
    <text x="680" y="293" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#111">Gf</text>

    <rect x="775" y="266" width="90" height="44" rx="4" fill="#e9e9e9" stroke="#333333" stroke-width="1.3"/>
    <text x="820" y="293" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#111">Gc</text>

    <rect x="915" y="266" width="90" height="44" rx="4" fill="#e9e9e9" stroke="#333333" stroke-width="1.3"/>
    <text x="960" y="293" text-anchor="middle" font-size="15" font-style="italic" font-weight="700" fill="#111">Gv</text>
  </g>

  <!-- panel B note -->
  <text x="820" y="345" text-anchor="middle" font-size="12.5" font-style="italic" fill="#444444">
    <tspan x="820" dy="0">Narrow abilities diletakkan di tengah agar jalur langsung</tspan>
    <tspan x="820" dy="16"><tspan font-style="italic" font-weight="700">g</tspan> (biru) dan broad abilities (hitam) sama-sama terlihat jelas</tspan>
  </text>

  <!-- legend -->
  <g font-size="11.5" fill="#333333">
    <line x1="650" y1="400" x2="680" y2="400" stroke="#14497F" stroke-width="2.2"/>
    <text x="686" y="404">jalur langsung <tspan font-style="italic" font-weight="700">g</tspan></text>
    <line x1="820" y1="400" x2="850" y2="400" stroke="#222222" stroke-width="1.8"/>
    <text x="856" y="404">jalur broad abilities</text>
  </g>

  <!-- bottom summary caption -->
  <text x="550" y="440" text-anchor="middle" font-size="12" fill="#555555">
    <tspan x="550" dy="0">Carroll menyatakan model tiga-lapisnya lebih dekat dengan struktur bifaktor daripada model hierarkis</tspan>
    <tspan x="550" dy="16">yang lazim digambarkan pada tes-tes berbasis CHC (Canivez, 2016; Canivez &amp; Youngstrom, 2019).</tspan>
  </text>
</svg>
